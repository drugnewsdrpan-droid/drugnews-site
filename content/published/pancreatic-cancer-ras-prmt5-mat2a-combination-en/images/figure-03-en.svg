<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">IDEAYA and the PRMT5 selectivity race</title>
  <desc id="desc">English scientific diagram comparing MTAP-deleted tumor cells, MTA, SAM, and PRMT5 inhibitor selectivity.</desc>
  <rect width="1600" height="1000" rx="36" fill="#F7FBFC"/>
  <text x="80" y="92" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#102C36">03 | PRMT5 Becomes a Selectivity Race</text>
  <text x="80" y="142" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#61707A">IDEAYA's argument: exploit MTA-rich tumor cells while avoiding SAM-rich normal cells.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="110" y="240" width="600" height="540" rx="34" fill="#FDF2F3" stroke="#E5B7BF" stroke-width="4"/>
    <text x="410" y="305" text-anchor="middle" font-size="34" font-weight="700" fill="#102C36">MTAP-Deleted Tumor Cell</text>
    <circle cx="410" cy="510" r="138" fill="#5E3B68"/>
    <circle cx="355" cy="470" r="36" fill="#8D5AA0"/>
    <circle cx="455" cy="545" r="42" fill="#8D5AA0"/>
    <circle cx="420" cy="438" r="30" fill="#D9732C"/>
    <text x="410" y="705" text-anchor="middle" font-size="28" font-weight="700" fill="#D36E2B">High MTA</text>
    <text x="410" y="746" text-anchor="middle" font-size="22" fill="#5E6D76">PRMT5 state becomes druggable</text>
    <rect x="890" y="240" width="600" height="540" rx="34" fill="#F1F8FA" stroke="#BFD7DB" stroke-width="4"/>
    <text x="1190" y="305" text-anchor="middle" font-size="34" font-weight="700" fill="#102C36">Normal Cell</text>
    <circle cx="1190" cy="510" r="138" fill="#DCEDEF" stroke="#178E9A" stroke-width="8"/>
    <circle cx="1138" cy="468" r="34" fill="#A7CFD4"/>
    <circle cx="1246" cy="552" r="38" fill="#A7CFD4"/>
    <circle cx="1198" cy="438" r="28" fill="#F2B25C"/>
    <text x="1190" y="705" text-anchor="middle" font-size="28" font-weight="700" fill="#178E9A">High SAM</text>
    <text x="1190" y="746" text-anchor="middle" font-size="22" fill="#5E6D76">Selectivity should spare normal PRMT5</text>
    <rect x="472" y="846" width="656" height="76" rx="20" fill="#102C36"/>
    <text x="800" y="895" text-anchor="middle" font-size="28" font-weight="700" fill="white">Best-in-class claim = wider therapeutic window</text>
    <path d="M745 515H855" stroke="#102C36" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 18"/>
  </g>
</svg>
