<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><rect width="1672" height="941" fill="#f7f9fc"/><text x="110" y="110" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#182b55">Four validation gates for an oncology platform</text><g font-family="Arial, sans-serif"><g fill="#fff" stroke="#637abb" stroke-width="4"><rect x="110" y="210" width="680" height="230" rx="28"/><rect x="880" y="210" width="680" height="230" rx="28"/><rect x="110" y="540" width="680" height="230" rx="28"/><rect x="880" y="540" width="680" height="230" rx="28"/></g><g fill="#54266f" font-size="34" font-weight="700"><text x="160" y="285">1. Mix shift</text><text x="930" y="285">2. Real clinical adoption</text><text x="160" y="615">3. Pivotal-trial execution</text><text x="930" y="615">4. Pipeline-to-revenue conversion</text></g><g fill="#4f5f78" font-size="27"><text x="160" y="345">Does non-Xtandi oncology keep gaining share?</text><text x="930" y="345">Does perioperative MIBC use become durable?</text><text x="160" y="675">5+ starts by end-FY2027; 10+ in FY2026–2030</text><text x="930" y="675">Potential is not realized revenue.</text></g></g><text x="110" y="870" font-family="Arial, sans-serif" font-size="30" fill="#182b55">A platform is a repeatable output engine—not a collection of promising assets.</text></svg>
