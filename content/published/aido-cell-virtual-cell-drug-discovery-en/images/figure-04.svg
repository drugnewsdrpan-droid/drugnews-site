    <g transform="translate(495 838)"><circle cx="25" cy="25" r="25" fill="#247eb1"/><text x="25" y="33" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">2</text><text x="66" y="19" font-size="20" font-weight="800" fill="#061c45">Blind accuracy</text><text x="66" y="46" font-size="16" fill="#607688">Unseen outcomes</text></g>
    <g transform="translate(840 838)"><circle cx="25" cy="25" r="25" fill="#f17b68"/><text x="25" y="33" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">3</text><text x="66" y="19" font-size="20" font-weight="800" fill="#061c45">Cost per decision</text><text x="66" y="46" font-size="16" fill="#607688">Fewer low-value tests</text></g>
    <g transform="translate(1212 838)"><circle cx="25" cy="25" r="25" fill="#07345e"/><text x="25" y="33" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">4</text><text x="66" y="19" font-size="20" font-weight="800" fill="#061c45">Decision time</text><text x="66" y="46" font-size="16" fill="#607688">Faster learning cycles</text></g>
  </g>
</svg>
