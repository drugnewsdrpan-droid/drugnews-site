<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">The virtual-cell evidence loop</title>
  <desc id="desc">A closed loop connects standardized data, a stateful model, high-value experiments and validated evidence, while four business metrics sit below.</desc>
  <defs><linearGradient id="loop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07345e"/><stop offset=".52" stop-color="#0b8d94"/><stop offset="1" stop-color="#26b6c8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#06335a" flood-opacity=".14"/></filter></defs>
  <rect width="1672" height="941" fill="#fff"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="836" y="91" text-anchor="middle" font-size="54" font-weight="800" fill="#061c45">THE VALUE IS THE EVIDENCE LOOP</text>
    <text x="836" y="138" text-anchor="middle" font-size="25" font-weight="600" fill="#4c6477">Data, models and experiments must keep correcting one another</text>
  </g>
