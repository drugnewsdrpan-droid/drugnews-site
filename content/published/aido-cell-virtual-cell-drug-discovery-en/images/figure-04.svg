    <path d="M759 746c-131 99-303 87-413-7l-43 55-60-184 193-21-39 51c77 57 178 58 257 1Z" fill="#247eb1"/>
    <circle cx="553" cy="424" r="187" fill="#fff" stroke="#c6e1e4" stroke-width="4"/>
    <circle cx="553" cy="424" r="105" fill="url(#loop)"/>
    <circle cx="553" cy="424" r="45" fill="#7264ad" stroke="#a9eef0" stroke-width="8"/>
    <g fill="none" stroke="#65e4e2" stroke-width="3"><circle cx="553" cy="424" r="79"/><path d="M474 424h158M553 345v158M497 368l112 112M497 480l112-112"/></g>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(124 221)"><rect width="355" height="126" rx="24" fill="#fff" stroke="#07345e" stroke-width="3"/><circle cx="61" cy="63" r="38" fill="#e4eef5"/><path d="M39 45h44M39 63h44M39 81h44" stroke="#07345e" stroke-width="7"/><text x="119" y="55" font-size="25" font-weight="800" fill="#061c45">STANDARDIZED DATA</text><text x="119" y="87" font-size="18" fill="#4c6477">Traceable · multimodal · legal</text></g>
    <g transform="translate(1118 196)"><rect width="400" height="126" rx="24" fill="#fff" stroke="#0b8d94" stroke-width="3"/><circle cx="61" cy="63" r="38" fill="#ddf4f2"/><path d="M37 61h48M61 37v48" stroke="#0b8d94" stroke-width="8"/><circle cx="61" cy="61" r="25" fill="none" stroke="#0b8d94" stroke-width="4"/><text x="119" y="55" font-size="25" font-weight="800" fill="#061c45">STATEFUL MODEL</text><text x="119" y="87" font-size="18" fill="#4c6477">Shared state · uncertainty</text></g>
    <g transform="translate(1118 591)"><rect width="400" height="126" rx="24" fill="#fff" stroke="#14a7b4" stroke-width="3"/><circle cx="61" cy="63" r="38" fill="#dff5f7"/><path d="M39 35h44v14L72 66v25c0 20-23 20-23 0V66L39 49Z" fill="none" stroke="#14a7b4" stroke-width="5"/><text x="119" y="55" font-size="25" font-weight="800" fill="#061c45">HIGH-VALUE TESTS</text><text x="119" y="87" font-size="18" fill="#4c6477">Synthesis · assays · decisions</text></g>
    <g transform="translate(124 615)"><rect width="385" height="126" rx="24" fill="#fff" stroke="#247eb1" stroke-width="3"/><circle cx="61" cy="63" r="38" fill="#e3eff8"/><path d="M38 63l16 16 31-35" fill="none" stroke="#247eb1" stroke-width="9" stroke-linecap="round"/><text x="119" y="55" font-size="25" font-weight="800" fill="#061c45">VALIDATED EVIDENCE</text><text x="119" y="87" font-size="18" fill="#4c6477">External · blinded · fit for use</text></g>
    <text x="809" y="593" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">VIRTUAL</text><text x="809" y="622" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">CELL</text>
