    <g transform="translate(442 318)"><rect width="210" height="292" rx="28" fill="#fff" stroke="#9bcfd4" stroke-width="4"/><circle cx="105" cy="96" r="55" fill="#edf7f8" stroke="#0b8d94" stroke-width="4"/><path d="M72 67l66 58M138 67l-66 58" stroke="#f17b68" stroke-width="12" stroke-linecap="round"/><text x="105" y="199" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#061c45">GENE</text><text x="105" y="231" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#061c45">KNOCKOUT</text><text x="105" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4c6477">State 1 retained</text></g>
    <g transform="translate(717 318)"><rect width="210" height="292" rx="28" fill="#fff" stroke="#9bcfd4" stroke-width="4"/><g transform="translate(47 43)" fill="#2d8deb" stroke="#0a4772" stroke-width="3"><polygon points="34,0 62,16 62,48 34,64 6,48 6,16"/><polygon points="92,43 116,57 116,84 92,98 68,84 68,57"/></g><text x="105" y="199" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#061c45">ADD</text><text x="105" y="231" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#061c45">DRUG</text><text x="105" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4c6477">State 2 accumulates</text></g>
