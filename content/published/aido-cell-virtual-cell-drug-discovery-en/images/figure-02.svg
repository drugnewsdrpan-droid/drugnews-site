  <rect width="1672" height="941" fill="#fff"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="836" y="95" text-anchor="middle" font-size="54" font-weight="800" fill="#061c45">A CELL THAT REMEMBERS</text>
    <text x="836" y="140" text-anchor="middle" font-size="26" font-weight="600" fill="#476579">One shared state · sequential perturbations · comparable branches</text>
  </g>
  <path d="M187 464H1162" stroke="#0b8d94" stroke-width="12" stroke-linecap="round"/>
  <g fill="#0b8d94"><path d="M445 464l-34-23v46Z"/><path d="M720 464l-34-23v46Z"/><path d="M995 464l-34-23v46Z"/></g>
