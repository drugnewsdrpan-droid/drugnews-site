<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">A cell that remembers</title>
  <desc id="desc">A shared digital cell state passes through gene knockout, drug exposure and resistance mutation, then branches into two comparable outcomes.</desc>
