  <g font-family="Inter, Arial, sans-serif"><text x="276" y="716" text-anchor="middle" font-size="27" font-weight="800" fill="#061c45">SHARED INITIAL STATE</text><text x="1478" y="166" text-anchor="middle" font-size="22" font-weight="800" fill="#0b8d94">RESPONSE A</text><text x="1478" y="790" text-anchor="middle" font-size="22" font-weight="800" fill="#d85d4a">RESPONSE B</text></g>
  <rect x="310" y="806" width="1052" height="72" rx="36" fill="#061c45"/>
  <text x="836" y="851" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">Each intervention starts from the state created by the one before it.</text>
</svg>
