<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="t d"><title id="t">From SOOTHE Phase 2 to the BELLUS acquisition</title><desc id="d">The figure separates early clinical evidence, the acquisition price, and the later pivotal test.</desc><rect width="1672" height="941" fill="#f8fafc"/><text x="112" y="115" font-family="Arial" font-size="32" font-weight="700" fill="#2c7480">FROM SIGNAL TO TRANSACTION</text><text x="112" y="194" font-family="Arial" font-size="58" font-weight="800" fill="#143b57">A compelling Phase 2 signal is still a hypothesis</text><g transform="translate(116 300)"><rect width="420" height="420" rx="32" fill="#e8f5f3"/><circle cx="210" cy="120" r="68" fill="#fff" stroke="#4b9c91" stroke-width="6"/><path d="M175 120h70M210 85v70" stroke="#4b9c91" stroke-width="10" stroke-linecap="round"/><text x="210" y="232" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#276a64">SOOTHE · Phase 2b</text><text x="210" y="286" text-anchor="middle" font-family="Arial" font-size="32" font-weight="800" fill="#143b57">~34% placebo-adjusted</text><text x="210" y="328" text-anchor="middle" font-family="Arial" font-size="27" fill="#506c76">cough-frequency reduction</text><text x="210" y="376" text-anchor="middle" font-family="Arial" font-size="25" fill="#506c76">Taste events ≤6.5%</text></g><path d="M560 510H690" stroke="#315c72" stroke-width="12" stroke-linecap="round"/><path d="m690 510-34-24v48z" fill="#315c72"/><g transform="translate(712 300)"><rect width="370" height="420" rx="32" fill="#eef3fa"/><circle cx="185" cy="124" r="70" fill="#fff" stroke="#587896" stroke-width="6"/><text x="185" y="140" text-anchor="middle" font-family="Arial" font-size="52" font-weight="800" fill="#315c72">$2B</text><text x="185" y="242" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#143b57">BELLUS Health</text><text x="185" y="290" text-anchor="middle" font-family="Arial" font-size="26" fill="#566f82">equity value</text><text x="185" y="346" text-anchor="middle" font-family="Arial" font-size="25" fill="#566f82">April 2023 agreement</text></g><path d="M1106 510H1236" stroke="#315c72" stroke-width="12" stroke-linecap="round"/><path d="m1236 510-34-24v48z" fill="#315c72"/><g transform="translate(1250 300)"><rect width="310" height="420" rx="32" fill="#fff0e8"/><circle cx="155" cy="124" r="70" fill="#fff" stroke="#d98561" stroke-width="6"/><text x="155" y="139" text-anchor="middle" font-family="Arial" font-size="44" font-weight="800" fill="#ad5d3c">?</text><text x="155" y="242" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#143b57">Phase 3</text><text x="155" y="290" text-anchor="middle" font-family="Arial" font-size="26" fill="#765e57">must reproduce</text><text x="155" y="330" text-anchor="middle" font-family="Arial" font-size="26" fill="#765e57">the evidence</text></g><text x="836" y="835" text-anchor="middle" font-family="Arial" font-size="28" fill="#647987">The transaction bought a late-stage opportunity—not certainty of approval.</text></svg>
