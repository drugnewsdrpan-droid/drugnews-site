<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="t d"><title id="t">Phase 3 retests the signal</title><desc id="d">Three neutral gates show the transition from an early signal to a reproducible late-stage result.</desc><rect width="1672" height="941" fill="#f7fafc"/><text x="110" y="115" font-family="Arial" font-size="32" font-weight="700" fill="#2c7480">REPRODUCIBILITY FRAMEWORK</text><text x="110" y="194" font-family="Arial" font-size="58" font-weight="800" fill="#143b57">Phase 3 is a new test, not a larger photocopy</text><g transform="translate(110 310)"><rect width="430" height="410" rx="34" fill="#fff" stroke="#bad3dc" stroke-width="4"/><circle cx="215" cy="112" r="68" fill="#e5f1f5"/><g fill="#315c72"><circle cx="190" cy="105" r="18"/><circle cx="240" cy="105" r="18"/><circle cx="215" cy="145" r="18"/></g><text x="215" y="245" text-anchor="middle" font-family="Arial" font-size="35" font-weight="800" fill="#143b57">Larger population</text><text x="215" y="296" text-anchor="middle" font-family="Arial" font-size="27" fill="#5c7482">More centres and</text><text x="215" y="333" text-anchor="middle" font-family="Arial" font-size="27" fill="#5c7482">greater heterogeneity</text></g><g transform="translate(621 310)"><rect width="430" height="410" rx="34" fill="#fff" stroke="#bad3dc" stroke-width="4"/><circle cx="215" cy="112" r="68" fill="#e5f1f5"/><circle cx="215" cy="112" r="39" fill="none" stroke="#315c72" stroke-width="8"/><path d="M215 112V83M215 112l27 16" stroke="#315c72" stroke-width="8" stroke-linecap="round"/><text x="215" y="245" text-anchor="middle" font-family="Arial" font-size="35" font-weight="800" fill="#143b57">Longer follow-up</text><text x="215" y="296" text-anchor="middle" font-family="Arial" font-size="27" fill="#5c7482">Durability and patient</text><text x="215" y="333" text-anchor="middle" font-family="Arial" font-size="27" fill="#5c7482">experience become visible</text></g><g transform="translate(1132 310)"><rect width="430" height="410" rx="34" fill="#fff" stroke="#bad3dc" stroke-width="4"/><circle cx="215" cy="112" r="68" fill="#e5f1f5"/><path d="M174 112h82M194 88l-24 24 24 24M236 88l24 24-24 24" fill="none" stroke="#315c72" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="215" y="245" text-anchor="middle" font-family="Arial" font-size="35" font-weight="800" fill="#143b57">Reproducibility</text><text x="215" y="296" text-anchor="middle" font-family="Arial" font-size="27" fill="#5c7482">Effect size and direction</text><text x="215" y="333" text-anchor="middle" font-family="Arial" font-size="27" fill="#5c7482">must hold up again</text></g><text x="836" y="835" text-anchor="middle" font-family="Arial" font-size="28" fill="#647987">Statistical significance, clinical meaning and repeatability must move together.</text></svg>
