  <style>.eyebrow{font:700 34px Arial;letter-spacing:5px;fill:#d86f26}.title{font:800 66px Arial;fill:#102b35}.subtitle{font:600 34px Arial;fill:#5f7078}.card-title{font:800 34px Arial;fill:#102b35}.card-body{font:600 25px Arial;fill:#60747d}.num{font:800 34px Arial;fill:white}.small{font:700 24px Arial;fill:#789}</style>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
