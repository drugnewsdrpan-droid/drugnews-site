<g><rect x="780" y="355" width="610" height="180" rx="26" fill="#ffffff" stroke="#c8dde2" stroke-width="4"/><circle cx="854" cy="433" r="42" fill="#d86f26"/><text x="854" y="446" text-anchor="middle" class="num">02</text><text x="920" y="425" class="card-title">Cancer cell</text><text x="920" y="473" class="card-body">One route is already broken</text></g>
<g><rect x="80" y="605" width="610" height="180" rx="26" fill="#ffffff" stroke="#c8dde2" stroke-width="4"/><circle cx="154" cy="683" r="42" fill="#0e8792"/><text x="154" y="696" text-anchor="middle" class="num">03</text><text x="220" y="675" class="card-title">Targeted drug</text><text x="220" y="723" class="card-body">Block the compensating route</text></g>
