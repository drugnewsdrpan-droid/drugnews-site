<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#f7fafb"/>
  <text x="80" y="88" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#15323e">台康生技三層價值堆疊</text>
  <g font-family="Arial, sans-serif">
    <rect x="120" y="420" width="960" height="118" rx="8" fill="#15323e"/>
    <text x="160" y="490" font-size="34" font-weight="700" fill="#ffffff">CDMO / CMC 製造底座</text>
    <text x="610" y="490" font-size="24" fill="#d9e9ee">營收品質、產能利用率、毛利率</text>
    <rect x="180" y="292" width="840" height="112" rx="8" fill="#3f86a8"/>
    <text x="220" y="360" font-size="34" font-weight="700" fill="#ffffff">Herwenda 商業化選擇權</text>
    <text x="670" y="360" font-size="24" fill="#e7f4f8">Sandoz、放量、分潤可見度</text>
    <rect x="250" y="170" width="700" height="104" rx="8" fill="#d98332"/>
    <text x="290" y="234" font-size="34" font-weight="700" fill="#ffffff">後續 biosimilar 平台重複性</text>
  </g>
  <text x="80" y="612" font-family="Arial, sans-serif" font-size="24" fill="#61717a">重點不是單一目標價，而是每個事件是否讓市場願意上修某一層價值。</text>
</svg>
