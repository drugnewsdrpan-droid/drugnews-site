name: Scheduled queue private diagnostic
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'drugnewsdrpan-droid/drugnews-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: github-pages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Authenticate and test real bundles without publishing
        env:
          DRUGNEWS_QUEUE_KEY_B64: ${{ secrets.DRUGNEWS_QUEUE_KEY_B64 }}
          DRUGNEWS_QUEUE_KEY_B64_V2: ${{ secrets.DRUGNEWS_QUEUE_KEY_B64_V2 }}
        run: node scripts/diagnose_scheduled_queue.mjs
      - name: Remove diagnostic plaintext
        if: always()
        run: node scripts/diagnose_scheduled_queue.mjs --cleanup
