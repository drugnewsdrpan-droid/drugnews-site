        if hashlib.sha256(packed).hexdigest() != "ea3e9e5d72f186b164cb22dd20a6400b50d260a078d7383346bc4914fc503dbb":
            raise SystemExit("Repair payload checksum mismatch")
        files = json.loads(zlib.decompress(packed))
        expected_files = {"apply_repair.py", "scripts/scheduled_content_integrity.mjs", "scripts/article_public_contract.mjs", "scripts/test_scheduled_contract.mjs"}
        if set(files) != expected_files:
            raise SystemExit("Unexpected repair bundle file list")
        for relative, text in files.items():
            target = bundle / relative
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_text(text)
        spec = importlib.util.spec_from_file_location("repair", bundle / "apply_repair.py")
        repair = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(repair)

        def git(*args):
            return subprocess.check_output(["git", *args], text=True).strip()

        if os.environ["GITHUB_REPOSITORY"] != "drugnewsdrpan-droid/drugnews-site" or os.environ["GITHUB_REF"] != "refs/heads/main":
            raise SystemExit("This repair is restricted to the owner's main branch")
        if git("status", "--porcelain"):
            raise SystemExit("Refusing to overwrite a dirty checkout")
        base = repair.BASE_COMMIT
        subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"], check=True)
        workflow = ".github/workflows/drugnews-mobile-repair.yml"
        allowed = set(repair.ORIGINAL_BLOBS) | set(repair.NEW_PATHS)
        changed = set(filter(None, git("diff", "--name-only", base, "HEAD").splitlines()))
        if not changed <= allowed | {workflow}:
            raise SystemExit("Repository changed beyond this repair; stop rather than overwrite newer work")
        # Generate the patch from the precisely verified original source, including
        # extracting the actual production renderer, not a rewritten approximation.
        source = {}
        for relative, expected in repair.ORIGINAL_BLOBS.items():
            raw = subprocess.check_output(["git", "show", base + ":" + relative])
            if repair.blob_sha(raw) != expected:
                raise SystemExit("Unexpected original blob: " + relative)
            source[relative] = raw.decode("utf-8")
        outputs = repair.make_outputs(source)
        if set(outputs) != allowed:
            raise SystemExit("Repair attempted to touch a non-allowlisted path")
        original_state = True
        patched_state = True
        for relative, text in outputs.items():
            target = repo / relative
            if target.is_symlink() or any(p.is_symlink() for p in target.parents if p != repo.parent):
                raise SystemExit("Refusing symlink path: " + relative)
            data = target.read_bytes() if target.exists() else None
            original_state &= (data is None if relative in repair.NEW_PATHS else data is not None and repair.blob_sha(data) == repair.ORIGINAL_BLOBS[relative])
            patched_state &= data == text.encode("utf-8")
        if not original_state and not patched_state:
            raise SystemExit("Current files are neither the verified originals nor this exact repair")
        if original_state:
            for relative, text in outputs.items():
                repair.atomic_write(repo / relative, text.encode("utf-8"))
            subprocess.run(["git", "add", "--", *sorted(allowed)], check=True)
            print("Eight repair files staged; nothing has been pushed or deployed.")
        else:
            print("Exact repair already installed; rerunning validation and deployment only.")
        manifest = {relative: hashlib.sha256(text.encode()).hexdigest() for relative, text in outputs.items()}
        (bundle / "expected-output-hashes.json").write_text(json.dumps(manifest))
        (bundle / "starting-head.txt").write_text(git("rev-parse", "HEAD"))
        subprocess.run(["git", "diff", "--cached", "--check"], check=True)
        for relative in outputs:
            if relative.endswith(".mjs"):
                subprocess.run(["node", "--check", relative], check=True)
        PY
    - name: Run added regressions and all original scheduled tests
      run: npm run test:scheduled
    - name: Freeze the same release clock for all checks
      id: clock
      run: echo "now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
    - name: Authenticate queue using existing secrets, never export them
      env:
        DRUGNEWS_QUEUE_KEY_B64: ${{ secrets.DRUGNEWS_QUEUE_KEY_B64 }}
        DRUGNEWS_QUEUE_KEY_B64_V2: ${{ secrets.DRUGNEWS_QUEUE_KEY_B64_V2 }}
      run: node scripts/scheduled_queue.mjs prepare --queue=content/scheduled --work-dir="$RUNNER_TEMP/drugnews-mobile-queue"
        --published=content/published --now="${{ steps.clock.outputs.now }}"
    - name: Build real due articles; keep future articles private
      env:
        DRUGNEWS_INBOX: ${{ runner.temp }}/drugnews-mobile-queue/staging
        DRUGNEWS_NOW: ${{ steps.clock.outputs.now }}
        DRUGNEWS_PUBLISH_PRODUCTION: '1'
      run: npm run publish
    - name: Run every existing quality gate
      run: |-
        npm run audit:references:strict
        npm run audit:reader:strict
        npm run audit:english-completeness:strict
        npm run audit:english-localization
    - name: Prepare the candidate outside the source checkout
      run: |-
        mkdir -p "$RUNNER_TEMP/drugnews-mobile-site"
        rsync -a --delete --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'content' --exclude 'scripts' --exclude 'node_modules' --exclude 'package.json' --exclude 'README.md' --exclude '.gitignore' ./ "$RUNNER_TEMP/drugnews-mobile-site/"
        find "$RUNNER_TEMP/drugnews-mobile-site" -type f -name '.DS_Store' -delete
    - name: Require original full-body, leak, duplicate and live-inventory gates
      run: node scripts/audit_scheduled_leaks.mjs candidate --root="$RUNNER_TEMP/drugnews-mobile-site" --repo-root=. --audit-file="$RUNNER_TEMP/drugnews-mobile-queue/private-audit.json"
        --live-base=https://drugnews.com.tw
    - name: Commit only the tested repair; reject concurrent changes
      id: commit
      run: |-
        python3 - <<'PY'
        import hashlib, json, os, pathlib, subprocess
        repo=pathlib.Path.cwd()
        bundle=pathlib.Path(os.environ["RUNNER_TEMP"])/"drugnews-mobile-repair"
        expected=json.loads((bundle/"expected-output-hashes.json").read_text())
        start=(bundle/"starting-head.txt").read_text().strip()
        def git(*args):
            return subprocess.check_output(["git",*args],text=True).strip()
        subprocess.run(["git","fetch","--quiet","origin","main"],check=True)
        if git("rev-parse","origin/main") != start or git("rev-parse","HEAD") != start:
            raise SystemExit("main changed during verification; refusing stale commit/deployment")
        for relative, digest in expected.items():
            if hashlib.sha256((repo/relative).read_bytes()).hexdigest() != digest:
                raise SystemExit("A tested source file changed during the build: "+relative)
        staged=set(filter(None,git("diff","--cached","--name-only").splitlines()))
        if staged and staged != set(expected):
            raise SystemExit("Unexpected staged files; refusing to publish generated/private content")
        if staged:
            subprocess.run(["git","-c","user.name=Drugnews Repair","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","commit","-m","Fix scheduled publication body and discovery contracts"],check=True)
            subprocess.run(["git","push","origin","HEAD:refs/heads/main"],check=True)
        head=git("rev-parse","HEAD")
        with open(os.environ["GITHUB_OUTPUT"],"a") as f:
            f.write("sha="+head+"\n")
        with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## Repair code validated and committed\nCommit: `"+head+"`\n\nThe website is NOT yet verified. The unchanged Pages workflow is next.\n")
        PY
    - name: Dispatch the unchanged production Pages workflow
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
    - name: Remove temporary plaintext and candidate on every exit
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/drugnews-mobile-queue" "$RUNNER_TEMP/drugnews-mobile-site" "$RUNNER_TEMP/drugnews-mobile-repair"
  verify:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
    - name: Wait for Pages then independently verify the incident article
      env:
        GH_TOKEN: ${{ github.token }}
        REPAIR_SHA: ${{ needs.repair.outputs.sha }}
      run: |-
        python3 - <<'PY'
        import json, os, time, urllib.request
        repo=os.environ["GITHUB_REPOSITORY"]
        sha=os.environ["REPAIR_SHA"]
        token=os.environ["GH_TOKEN"]
        api="https://api.github.com/repos/"+repo
        headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
        def read_json(url):
            request=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(request,timeout=30) as r:
                return json.load(r)
        run=None
        # No concurrency lock in this job: Pages must be able to start.
        for attempt in range(100):
            try:
                rows=read_json(api+"/actions/runs?head_sha="+sha+"&event=workflow_dispatch&per_page=20")["workflow_runs"]
                matches=[r for r in rows if r.get("path")==".github/workflows/pages.yml" and r.get("head_sha")==sha]
                if matches:
                    run=max(matches,key=lambda r:r["id"])
                    if run["status"]=="completed":
                        break
            except Exception as exc:
                print("Status read retry:",type(exc).__name__)
            time.sleep(15)
        else:
            raise SystemExit("Pages verification timed out. Inspect Actions; do not claim restoration.")
        if run["conclusion"] != "success":
            raise SystemExit("Pages did not pass: "+str(run["conclusion"])+" "+run["html_url"])
        # The original Pages workflow already audits all due and private jobs.
        # Independently read the incident article, the public index and sitemap.
        base="https://drugnews.com.tw/"
        path="articles/2026-09-05-elecsys-ptau217-alzheimers-blood-test.html"
        def read_site(relative):
            request=urllib.request.Request(base+relative,headers={"Cache-Control":"no-cache"})
            with urllib.request.urlopen(request,timeout=30) as response:
                if response.status != 200:
                    raise RuntimeError("Public surface not available: "+relative)
                return response.read().decode("utf-8")
        html=read_site(path)
        if 'rel="canonical" href="'+base+path+'"' not in html:
            raise SystemExit("Incident article canonical URL failed")
        rows=json.loads(read_site("search-index.json"))
        if not any(path in str(r.get("url","")) for r in rows):
            raise SystemExit("Incident article missing from public search")
        if "<loc>"+base+path+"</loc>" not in read_site("sitemap.xml"):
            raise SystemExit("Incident article missing from sitemap")
        with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## Production verification PASSED\n\n- Repair commit: `"+sha+"`\n- Original Pages workflow: "+run["html_url"]+"\n- Incident article: "+base+path+"\n- Search and sitemap read-back: passed\n- Original full candidate and live audits: passed via Pages\n")
        print("PRODUCTION VERIFIED",sha,run["html_url"])
        PY
