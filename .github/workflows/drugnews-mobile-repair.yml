# Drugnews one-time, owner-authorized repair. Upload THIS file to .github/workflows/.
# No Codex/OpenAI calls, no personal token, no third-party service.
# Writes only 8 allowlisted code/test files after version checks, real queue build
# and all safety gates; never commits decrypted articles or secrets.
# Does not change the existing Pages workflow or bypass branch/environment rules.
# The embedded compressed payload is checksum-verified source code, not credentials.
name: Drugnews mobile repair
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/drugnews-mobile-repair.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'drugnewsdrpan-droid/drugnews-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: drugnews-pages-production
      cancel-in-progress: false
    environment: github-pages
    permissions:
      contents: write
      actions: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout the owner-authorized main revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
