    - name: Run added regressions and all original scheduled tests
      run: npm run test:scheduled
    - name: Freeze the same release clock for all checks
      id: clock
      run: echo "now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
    - name: Authenticate queue using existing secrets, never export them
      env:
        DRUGNEWS_QUEUE_KEY_B64: ${{ secrets.DRUGNEWS_QUEUE_KEY_B64 }}
        DRUGNEWS_QUEUE_KEY_B64_V2: ${{ secrets.DRUGNEWS_QUEUE_KEY_B64_V2 }}
      run: node scripts/scheduled_queue.mjs prepare --queue=content/scheduled --work-dir="$RUNNER_TEMP/drugnews-mobile-queue"
        --published=content/published --now="${{ steps.clock.outputs.now }}"
    - name: Build real due articles; keep future articles private
      env:
        DRUGNEWS_INBOX: ${{ runner.temp }}/drugnews-mobile-queue/staging
        DRUGNEWS_NOW: ${{ steps.clock.outputs.now }}
        DRUGNEWS_PUBLISH_PRODUCTION: '1'
      run: npm run publish
    - name: Run every existing quality gate
      run: |-
        npm run audit:references:strict
        npm run audit:reader:strict
        npm run audit:english-completeness:strict
        npm run audit:english-localization
    - name: Prepare the candidate outside the source checkout
      run: |-
        mkdir -p "$RUNNER_TEMP/drugnews-mobile-site"
        rsync -a --delete --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'content' --exclude 'scripts' --exclude 'node_modules' --exclude 'package.json' --exclude 'README.md' --exclude '.gitignore' ./ "$RUNNER_TEMP/drugnews-mobile-site/"
        find "$RUNNER_TEMP/drugnews-mobile-site" -type f -name '.DS_Store' -delete
    - name: Require original full-body, leak, duplicate and live-inventory gates
      run: node scripts/audit_scheduled_leaks.mjs candidate --root="$RUNNER_TEMP/drugnews-mobile-site" --repo-root=. --audit-file="$RUNNER_TEMP/drugnews-mobile-queue/private-audit.json"
        --live-base=https://drugnews.com.tw
    - name: Commit only the tested repair; reject concurrent changes
      id: commit
      run: |-
        python3 - <<'PY'
        import hashlib, json, os, pathlib, subprocess
        repo=pathlib.Path.cwd()
        bundle=pathlib.Path(os.environ["RUNNER_TEMP"])/"drugnews-mobile-repair"
        expected=json.loads((bundle/"expected-output-hashes.json").read_text())
        start=(bundle/"starting-head.txt").read_text().strip()
        def git(*args):
            return subprocess.check_output(["git",*args],text=True).strip()
        subprocess.run(["git","fetch","--quiet","origin","main"],check=True)
        if git("rev-parse","origin/main") != start or git("rev-parse","HEAD") != start:
            raise SystemExit("main changed during verification; refusing stale commit/deployment")
        for relative, digest in expected.items():
            if hashlib.sha256((repo/relative).read_bytes()).hexdigest() != digest:
                raise SystemExit("A tested source file changed during the build: "+relative)
        # Only already-due, authenticated public descriptors cross to the verifier.
        from datetime import datetime
        import base64
        audit=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"drugnews-mobile-queue"/"private-audit.json").read_text())
        clock=datetime.fromisoformat(audit["clock"].replace("Z","+00:00"))
        articles=[]
        for job in audit["jobs"]:
            if job["state"] not in ["due","duplicate","legacy_e4"]:
                continue
            published=datetime.fromisoformat(job["publish_at"].replace("Z","+00:00"))
            if published > clock:
                raise SystemExit("A future article was incorrectly marked public")
            for article in job["articles"]:
                item={key:article[key] for key in ["lang","url_path","category","body_sha256","images","website_images"] if key in article}
                item["publish_at"]=job["publish_at"]
                articles.append(item)
        for lang in set(a["lang"] for a in articles):
            ordered=sorted([a for a in articles if a["lang"]==lang],key=lambda a:a["publish_at"],reverse=True)
            for i,article in enumerate(ordered):
                article["homepage_expected"]=i<5
        required={"articles/2026-09-05-elecsys-ptau217-alzheimers-blood-test.html","articles/2026-09-06-oral-macrocyclic-peptide-platform.html"}
        if not required.issubset({a["url_path"] for a in articles}):
            raise SystemExit("Both incident articles must be covered by the authenticated receipt")
        receipt={"schema_version":1,"articles":articles}
        staged=set(filter(None,git("diff","--cached","--name-only").splitlines()))
        if staged and staged != set(expected):
            raise SystemExit("Unexpected staged files; refusing to publish generated/private content")
        if staged:
            subprocess.run(["git","-c","user.name=Drugnews Repair","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","commit","-m","Fix scheduled publication body and discovery contracts"],check=True)
            subprocess.run(["git","push","origin","HEAD:refs/heads/main"],check=True)
        head=git("rev-parse","HEAD")
        receipt["commit"]=head
        encoded=base64.b64encode(json.dumps(receipt,ensure_ascii=False,separators=(",",":")).encode()).decode()
        with open(os.environ["GITHUB_OUTPUT"],"a") as f:
            f.write("sha="+head+"\n")
            f.write("receipt="+encoded+"\n")
        with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## Repair code validated and committed\nCommit: `"+head+"`\n\nThe website is NOT yet verified. The unchanged Pages workflow is next.\n")
        PY
    - name: Dispatch the unchanged production Pages workflow
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        echo "since=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
        gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      id: dispatch
    - name: Remove temporary plaintext and candidate on every exit
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/drugnews-mobile-queue" "$RUNNER_TEMP/drugnews-mobile-site" "$RUNNER_TEMP/drugnews-mobile-repair"
    - name: Report exact repair stage without claiming restoration
      if: always()
      env:
        JOB_RESULT: ${{ job.status }}
      run: |-
        python3 - <<'PY'
        import os
        with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            result=os.environ["JOB_RESULT"]
            f.write("\n## 修復階段狀態："+result+"\n")
            f.write("此狀態不代表官網已恢復。只有 verify 工作完成新版提交、全文、圖片及入口回讀檢查，才能確認上線。\n")
        PY
  verify:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
    - name: Checkout the exact tested repair commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.repair.outputs.sha }}
    - name: Require the new Pages run and both mandatory deployment steps
      env:
        GH_TOKEN: ${{ github.token }}
        REPAIR_SHA: ${{ needs.repair.outputs.sha }}
        DISPATCH_SINCE: ${{ needs.repair.outputs.since }}
      run: |-
        python3 - <<'PY'
        import json, os, time, urllib.request
        repo=os.environ["GITHUB_REPOSITORY"]
        sha=os.environ["REPAIR_SHA"]
        token=os.environ["GH_TOKEN"]
        api="https://api.github.com/repos/"+repo
        headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
        def read_json(url):
            request=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(request,timeout=30) as r:
                return json.load(r)
        run=None
        # No concurrency lock in this job: Pages must be able to start.
        for attempt in range(100):
            try:
                rows=read_json(api+"/actions/runs?head_sha="+sha+"&event=workflow_dispatch&per_page=20")["workflow_runs"]
                matches=[r for r in rows if r.get("path")==".github/workflows/pages.yml" and r.get("head_sha")==sha and r.get("created_at","")>=os.environ["DISPATCH_SINCE"]]
                if matches:
                    run=max(matches,key=lambda r:r["id"])
                    if run["status"]=="completed":
                        break
            except Exception as exc:
                print("Status read retry:",type(exc).__name__)
            time.sleep(15)
        else:
            raise SystemExit("Pages verification timed out. Inspect Actions; do not claim restoration.")
        if run["conclusion"] != "success":
            raise SystemExit("Pages did not pass: "+str(run["conclusion"])+" "+run["html_url"])
        import pathlib
        jobs=read_json(api+"/actions/runs/"+str(run["id"])+"/jobs")["jobs"]
        target=pathlib.Path(os.environ["RUNNER_TEMP"])/"native-deployment-evidence.json"
        target.write_text(json.dumps({"run":run,"jobs":jobs}))
        PY
        node --input-type=module <<'JS'
        import fs from 'node:fs/promises';
        import path from 'node:path';
        import { requireSuccessfulDeployment } from './scripts/verify_repair_receipt.mjs';
        const file=path.join(process.env.RUNNER_TEMP,'native-deployment-evidence.json');
        const {run,jobs}=JSON.parse(await fs.readFile(file,'utf8'));
        requireSuccessfulDeployment(run,jobs,process.env.REPAIR_SHA,process.env.DISPATCH_SINCE);
        console.log('NATIVE_DEPLOYMENT_VERIFIED',run.head_sha,run.html_url);
        await fs.appendFile(process.env.GITHUB_STEP_SUMMARY,`## 新版 Pages 已通過，仍須下一步正式內容驗收\n\n- Workflow: ${run.html_url}\n- Commit: ${run.head_sha}\n`);
        JS
    - name: Verify live full-body and image digests against the authenticated pre-release receipt
      env:
        PUBLIC_RECEIPT_B64: ${{ needs.repair.outputs.receipt }}
        REPAIR_SHA: ${{ needs.repair.outputs.sha }}
      run: node scripts/verify_repair_receipt.mjs
