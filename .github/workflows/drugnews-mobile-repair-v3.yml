            print("Thirteen repair files staged; nothing has been pushed or deployed.")
        else:
            print("Exact repair already installed; rerunning validation and deployment only.")
        manifest = {relative: hashlib.sha256(text.encode()).hexdigest() for relative, text in outputs.items()}
        (bundle / "expected-output-hashes.json").write_text(json.dumps(manifest))
        (bundle / "starting-head.txt").write_text(git("rev-parse", "HEAD"))
        subprocess.run(["git", "diff", "--cached", "--check"], check=True)
        for relative in outputs:
            if relative.endswith(".mjs"):
                subprocess.run(["node", "--check", relative], check=True)
