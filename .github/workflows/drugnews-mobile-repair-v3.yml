# Version 3: full dependency closure, authenticated image references, and exact live content receipts.
# Owner-authorized only. No API keys or private plaintext are exported.
# Success of the repair job alone is NOT proof of website restoration.
name: Drugnews mobile repair v3 - full verification
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/drugnews-mobile-repair-v3.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'drugnewsdrpan-droid/drugnews-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: drugnews-pages-production
      cancel-in-progress: false
    environment: github-pages
    permissions:
      contents: write
      actions: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      receipt: ${{ steps.commit.outputs.receipt }}
      since: ${{ steps.dispatch.outputs.since }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout the owner-authorized main revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
