        if os.environ["GITHUB_REPOSITORY"] != "drugnewsdrpan-droid/drugnews-site" or os.environ["GITHUB_REF"] != "refs/heads/main":
            raise SystemExit("This repair is restricted to the owner's main branch")
        if git("status", "--porcelain"):
            raise SystemExit("Refusing to overwrite a dirty checkout")
        base = repair.BASE_COMMIT
        subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"], check=True)
        workflow = ".github/workflows/drugnews-mobile-repair-v3.yml"
        prior_workflow = ".github/workflows/drugnews-mobile-repair.yml"
        allowed = set(repair.ORIGINAL_BLOBS) | set(repair.NEW_PATHS)
        changed = set(filter(None, git("diff", "--name-only", base, "HEAD").splitlines()))
        if not changed <= allowed | {workflow, prior_workflow, ".github/workflows/drugnews-mobile-repair-v2.yml"}:
            raise SystemExit("Repository changed beyond this repair; stop rather than overwrite newer work")
        # Generate the patch from the precisely verified original source, including
        # extracting the actual production renderer, not a rewritten approximation.
        source = {}
        for relative, expected in repair.ORIGINAL_BLOBS.items():
            raw = subprocess.check_output(["git", "show", base + ":" + relative])
            if repair.blob_sha(raw) != expected:
                raise SystemExit("Unexpected original blob: " + relative)
            source[relative] = raw.decode("utf-8")
        outputs = repair.make_outputs(source)
        if set(outputs) != allowed:
            raise SystemExit("Repair attempted to touch a non-allowlisted path")
        original_state = True
        patched_state = True
        for relative, text in outputs.items():
            target = repo / relative
            if target.is_symlink() or any(p.is_symlink() for p in target.parents if p != repo.parent):
                raise SystemExit("Refusing symlink path: " + relative)
            data = target.read_bytes() if target.exists() else None
            original_state &= (data is None if relative in repair.NEW_PATHS else data is not None and repair.blob_sha(data) == repair.ORIGINAL_BLOBS[relative])
            patched_state &= data == text.encode("utf-8")
        if not original_state and not patched_state:
            raise SystemExit("Current files are neither the verified originals nor this exact repair")
        if original_state:
            for relative, text in outputs.items():
                repair.atomic_write(repo / relative, text.encode("utf-8"))
