<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="3534" viewBox="0 0 390 1178" role="img" aria-labelledby="title desc">
<title id="title">合作、供應與組織持有，是不同承諾</title>
<desc id="desc">第一三共以不同DXd合作資產連結AstraZeneca及Merck，負責所列資產的製造與供應，並保留日本獨家權利。另一個分開的區域顯示Gilead完成收購Tubulis。圖中僅呈現三個已披露關係。</desc>
