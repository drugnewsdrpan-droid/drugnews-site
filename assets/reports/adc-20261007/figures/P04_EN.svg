<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="3534" viewBox="0 0 390 1178" role="img" aria-labelledby="title desc">
<title id="title">Alliances, supply and ownership are different commitments</title>
<desc id="desc">Daiichi Sankyo connects its partnered DXd assets to AstraZeneca and Merck. It supplies the listed assets and retains exclusive Japanese rights. A separate arrow shows Gilead’s completed acquisition of Tubulis. Only three disclosed relationships are shown.</desc>
