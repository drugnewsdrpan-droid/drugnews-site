<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="t d"><title id="t">Camlipixant programme boundaries</title><desc id="d">The RCC programme is stopped while the separate Phase 2b BALANCE IBS study remains under evaluation.</desc><rect width="1672" height="941" fill="#f8fafc"/><text x="110" y="115" font-family="Arial" font-size="32" font-weight="700" fill="#2c7480">PROGRAMME BOUNDARY</text><text x="110" y="194" font-family="Arial" font-size="58" font-weight="800" fill="#143b57">One indication stopped; another study continues</text><g transform="translate(110 308)"><rect width="680" height="430" rx="36" fill="#fff1eb" stroke="#e2a184" stroke-width="4"/><rect x="52" y="52" width="164" height="48" rx="24" fill="#f8d8c9"/><text x="134" y="84" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#ad5d3c">STOPPED</text><text x="52" y="178" font-family="Arial" font-size="35" font-weight="800" fill="#143b57">Refractory chronic cough</text><text x="52" y="228" font-family="Arial" font-size="30" fill="#765e57">CALM-1 / CALM-2</text><line x1="52" y1="287" x2="628" y2="287" stroke="#e7c1ae" stroke-width="4"/><text x="52" y="346" font-family="Arial" font-size="27" fill="#765e57">Overall efficacy judged insufficient</text><text x="52" y="385" font-family="Arial" font-size="27" fill="#765e57">to transform patient care</text></g><g transform="translate(882 308)"><rect width="680" height="430" rx="36" fill="#e8f5f3" stroke="#8bc1b8" stroke-width="4"/><rect x="52" y="52" width="196" height="48" rx="24" fill="#cfe9e4"/><text x="150" y="84" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#276a64">CONTINUING</text><text x="52" y="178" font-family="Arial" font-size="35" font-weight="800" fill="#143b57">IBS-D / IBS-M</text><text x="52" y="228" font-family="Arial" font-size="30" fill="#506c76">BALANCE · Phase 2b</text><line x1="52" y1="287" x2="628" y2="287" stroke="#b9ddd6" stroke-width="4"/><text x="52" y="346" font-family="Arial" font-size="27" fill="#506c76">Still being evaluated; outcome</text><text x="52" y="385" font-family="Arial" font-size="27" fill="#506c76">must not be prejudged</text></g><text x="836" y="835" text-anchor="middle" font-family="Arial" font-size="28" fill="#647987">Evidence from one disease cannot be directly extrapolated to another.</text></svg>
