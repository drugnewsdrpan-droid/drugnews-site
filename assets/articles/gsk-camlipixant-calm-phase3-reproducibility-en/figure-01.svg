<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="t d"><title id="t">CALM-1 and CALM-2 produced different pivotal outcomes</title><desc id="d">A neutral side-by-side comparison of the same camlipixant dose in two Phase 3 studies.</desc><rect width="1672" height="941" fill="#f7fafc"/><text x="110" y="116" font-family="Arial" font-size="32" font-weight="700" fill="#2c7480">PHASE 3 READOUT</text><text x="110" y="194" font-family="Arial" font-size="58" font-weight="800" fill="#143b57">Same dose, different pivotal answers</text><text x="110" y="244" font-family="Arial" font-size="27" fill="#5a7080">Camlipixant 50 mg twice daily</text><g transform="translate(110 310)"><rect width="660" height="450" rx="34" fill="#fff" stroke="#8bc1b8" stroke-width="4"/><rect x="54" y="54" width="184" height="48" rx="24" fill="#e4f4f1"/><text x="146" y="87" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#276a64">CALM-1</text><text x="54" y="176" font-family="Arial" font-size="38" font-weight="800" fill="#143b57">Week 12</text><text x="54" y="236" font-family="Arial" font-size="32" fill="#284f62">24-hour cough frequency</text><path d="M58 298H600" stroke="#d8e6e7" stroke-width="12" stroke-linecap="round"/><path d="M58 298H470" stroke="#4b9c91" stroke-width="12" stroke-linecap="round"/><text x="54" y="386" font-family="Arial" font-size="34" font-weight="800" fill="#276a64">Primary endpoint met</text></g><g transform="translate(902 310)"><rect width="660" height="450" rx="34" fill="#fff" stroke="#e2a184" stroke-width="4"/><rect x="54" y="54" width="184" height="48" rx="24" fill="#fff0e8"/><text x="146" y="87" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#ad5d3c">CALM-2</text><text x="54" y="176" font-family="Arial" font-size="38" font-weight="800" fill="#143b57">Week 24</text><text x="54" y="236" font-family="Arial" font-size="32" fill="#284f62">24-hour cough frequency</text><path d="M58 298H600" stroke="#f0ddd4" stroke-width="12" stroke-linecap="round"/><path d="M58 298H320" stroke="#d98561" stroke-width="12" stroke-linecap="round"/><text x="54" y="386" font-family="Arial" font-size="31" font-weight="800" fill="#ad5d3c">Not statistically significant</text></g><text x="836" y="846" text-anchor="middle" font-family="Arial" font-size="26" fill="#647987">One positive trial is not the same as a reproducible evidence package.</text></svg>
