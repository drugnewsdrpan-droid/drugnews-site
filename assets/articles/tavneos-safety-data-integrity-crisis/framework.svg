    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','PingFang TC',sans-serif;font-size:39px;line-height:1.2;color:#101820;font-weight:900;letter-spacing:0;">Tavneos 危機：20 例死亡通報、資料完整性疑雲，Amgen 罕病明星藥站上撤市邊緣</div>
  </foreignObject>
