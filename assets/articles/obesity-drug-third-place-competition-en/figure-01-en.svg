<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Figure 1 | The Duopoly Battle Moves Beyond Single Products">
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="54%" stop-color="#f8fbfb"/>
      <stop offset="100%" stop-color="#fff8f1"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#12313c" flood-opacity=".12"/>
    </filter>
  </defs>
  <style>
    .title{font:800 34px Inter,Arial,sans-serif;fill:#122f3a}
    .eyebrow{font:800 18px Inter,Arial,sans-serif;letter-spacing:.12em;fill:#9e5b28;text-transform:uppercase}
    .label{font:800 25px Inter,Arial,sans-serif;fill:#12313c}
    .body{font:700 22px Inter,Arial,sans-serif;fill:#243943}
    .note{font:700 17px Inter,Arial,sans-serif;fill:#58707b}
    .small{font:700 16px Inter,Arial,sans-serif;fill:#607680}
    .axis{font:800 20px Inter,Arial,sans-serif;fill:#265f73}
    .brand{font:900 31px Inter,Arial,sans-serif;fill:#12313c}
  </style>
  <rect width="1200" height="760" fill="#eef5f4"/>
  <rect x="34" y="34" width="1132" height="692" rx="24" fill="url(#sheet)" stroke="#cddbe0" stroke-width="2" filter="url(#softShadow)"/>
  <text x="64" y="86" class="title">Figure 1 | The Duopoly Battle Moves Beyond Single Products</text>

  <g transform="translate(70 128)">
    <rect x="0" y="0" width="455" height="496" rx="18" fill="#f2f8fb" stroke="#b9d4df"/>
    <text x="228" y="54" class="brand" text-anchor="middle">Novo Nordisk</text>
    <rect x="55" y="78" width="345" height="50" rx="14" fill="#2d85b7"/>
    <text x="228" y="111" class="label" text-anchor="middle" fill="#fff">semaglutide family</text>
    <g>
      <rect x="82" y="142" width="44" height="18" rx="9" fill="#f7faf9" stroke="#2d85b7" stroke-width="3" transform="rotate(-35 104 151)"/>
      <text x="146" y="170" class="body" text-anchor="start">Ozempic (injection)</text>
    </g>
<g>
      <rect x="82" y="210" width="44" height="18" rx="9" fill="#f7faf9" stroke="#2d85b7" stroke-width="3" transform="rotate(-35 104 219)"/>
      <text x="146" y="238" class="body" text-anchor="start">Wegovy (injection)</text>
    </g>
<g>
      <rect x="82" y="278" width="44" height="18" rx="9" fill="#f7faf9" stroke="#2d85b7" stroke-width="3" transform="rotate(-35 104 287)"/>
      <text x="146" y="306" class="body" text-anchor="start">Rybelsus (oral)</text>
    </g>
<g>
      <rect x="82" y="346" width="44" height="18" rx="9" fill="#f7faf9" stroke="#2d85b7" stroke-width="3" transform="rotate(-35 104 355)"/>
      <text x="146" y="374" class="body" text-anchor="start">Wegovy pill (oral)</text>
    </g>
    <rect x="42" y="400" width="370" height="84" rx="16" fill="#e4f2fa" stroke="#b7d4df"/>
    <text x="227" y="426" class="small" text-anchor="middle">Brand + physician familiarity</text>
<text x="227" y="451" class="small" text-anchor="middle">Global supply chain</text>
<text x="227" y="476" class="small" text-anchor="middle">Injection franchise extends into oral therapy</text>
  </g>

  <g transform="translate(675 128)">
    <rect x="0" y="0" width="455" height="496" rx="18" fill="#fff4f1" stroke="#e4c4bd"/>
    <text x="228" y="54" class="brand" text-anchor="middle" fill="#c83f3a">Lilly</text>
    <rect x="55" y="78" width="345" height="50" rx="14" fill="#d95a55"/>
    <text x="228" y="111" class="label" text-anchor="middle" fill="#fff">tirzepatide family</text>
    <g>
      <rect x="82" y="142" width="44" height="18" rx="9" fill="#f7faf9" stroke="#d95a55" stroke-width="3" transform="rotate(-35 104 151)"/>
      <text x="146" y="170" class="body" text-anchor="start">Mounjaro (injection)</text>
    </g>
<g>
      <rect x="82" y="210" width="44" height="18" rx="9" fill="#f7faf9" stroke="#d95a55" stroke-width="3" transform="rotate(-35 104 219)"/>
      <text x="146" y="238" class="body" text-anchor="start">Zepbound (injection)</text>
    </g>
<g>
      <rect x="82" y="278" width="44" height="18" rx="9" fill="#f7faf9" stroke="#d95a55" stroke-width="3" transform="rotate(-35 104 287)"/>
      <text x="146" y="293" class="body" text-anchor="start">retatrutide</text>
<text x="146" y="319" class="body" text-anchor="start">(GIP / GLP-1 / glucagon)</text>
    </g>
<g>
      <rect x="82" y="346" width="44" height="18" rx="9" fill="#f7faf9" stroke="#d95a55" stroke-width="3" transform="rotate(-35 104 355)"/>
      <text x="146" y="361" class="body" text-anchor="start">orforglipron</text>
<text x="146" y="387" class="body" text-anchor="start">(oral small molecule)</text>
    </g>
    <rect x="42" y="400" width="370" height="84" rx="16" fill="#fde7e0" stroke="#e4c4bd"/>
    <text x="227" y="426" class="small" text-anchor="middle">Stronger efficacy</text>
<text x="227" y="451" class="small" text-anchor="middle">Deeper next-generation pipeline</text>
<text x="227" y="476" class="small" text-anchor="middle">Multi-target biology and oralization</text>
  </g>

  <g transform="translate(525 254)">
    <rect x="0" y="0" width="150" height="176" rx="22" fill="#fff" stroke="#cddbe0"/>
    <path d="M44 44 h62 v70 h-62z" fill="#eef3f5" stroke="#9cb1ba"/>
    <path d="M56 44 v-16 h38 v16" fill="none" stroke="#9cb1ba" stroke-width="7" stroke-linecap="round"/>
    <text x="75" y="142" class="brand" text-anchor="middle">VS.</text>
  </g>
</svg>
