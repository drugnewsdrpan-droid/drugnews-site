<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Operation TrialBlazer valuation logic</title>
  <desc id="desc">A clean Drugnews infographic explaining how FDA efficiency can raise biotech rNPV.</desc>
  <rect width="1280" height="720" rx="30" fill="#f7fbf9"/>
  <text x="76" y="76" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#a85d29" letter-spacing="3">FIGURE 01</text>
  <text x="76" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#111820">Operation TrialBlazer</text>
  <text x="76" y="176" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#5d6b75">Why regulatory efficiency can move biotech valuation</text>
  <g transform="translate(80 250)">
    <rect width="230" height="150" rx="24" fill="#ffffff" stroke="#c9dce2" stroke-width="2"/>
    <text x="28" y="54" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#12364a">Clearer FDA</text>
    <text x="28" y="90" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5d6b75">More predictable</text>
    <text x="28" y="122" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5d6b75">review path</text>
    <path d="M250 74 h98" stroke="#0f8f9a" stroke-width="10" stroke-linecap="round"/>
    <path d="M338 44 l38 30-38 30" fill="none" stroke="#0f8f9a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="400" width="230" height="150" rx="24" fill="#ffffff" stroke="#c9dce2" stroke-width="2"/>
    <text x="428" y="54" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#12364a">Fewer Delays</text>
    <text x="428" y="90" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5d6b75">Less avoidable</text>
    <text x="428" y="122" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5d6b75">trial friction</text>
    <path d="M650 74 h98" stroke="#0f8f9a" stroke-width="10" stroke-linecap="round"/>
    <path d="M738 44 l38 30-38 30" fill="none" stroke="#0f8f9a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="800" width="230" height="150" rx="24" fill="#ffffff" stroke="#c9dce2" stroke-width="2"/>
    <text x="828" y="54" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#12364a">Higher rNPV</text>
    <text x="828" y="90" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5d6b75">Shorter time</text>
    <text x="828" y="122" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5d6b75">to market</text>
  </g>
  <g transform="translate(105 500)">
    <rect width="1070" height="110" rx="26" fill="#e8f5f4" stroke="#b9dadd" stroke-width="2"/>
    <text x="38" y="48" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#12364a">Investor takeaway</text>
    <text x="38" y="82" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#40515d">The FDA does not create data. But a predictable path can make existing data more valuable.</text>
  </g>
</svg>
